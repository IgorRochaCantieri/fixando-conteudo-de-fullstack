<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Eventos em formulários</title>
</head>
<body>
    <div class="container">
        <h1 class="text-success">Exercicios com radio</h1>

        <div class="row mb-3">
            <h2>Selecione um radio buttom e clique em enviar</h2>
        </div>

        <!--A tag <form> da sentido de formulário ao conjunto de elementos dentro dele-->
        <!-- O atributo action (action="") dentro do form define o destino para onde os dados do formulário serão enviados quando ele for submetido-->
        <form action="">
            <div class="row">
                
                <h3>Gênero</h3>

                <!-- O atributo type define o tipo input do formulário e transforma o input em um radio button -->
                <!-- O atributo name (name="") define o nome do campo do input, e no caso do radio botton como todos os inputs possuem o mesmo name o usuário só poderá selecionar apenas um campo porque todos fazem parte do mesmo grupo de seleção -->
                <!-- O atributo value (value="") define o valor deste input, que poderá ser acessado pelo Javascript -->
                <div><input type="radio" name="gender" value="Masculino"> Masculino</div>
                <div><input type="radio" name="gender" value="Feminino"> Feminino</div>
                <div class="mb-3"><input type="radio" name="gender" value="Outros"> Outros</div>

                <!-- O atributo type (type="") define o tipo/comportamento do botão, e o seu valor button ("button") define um botão comum -->
                <!-- O atributo onclick (onclick="") é um atributo de evento html, ja o seu valor "displayRadioValue()" executa a função displayRadioValue() no JavaScript-->
                <div class="mb-3"><button type="button" onclick="displayRadioValue()">Enviar</button></div>

                <div id="resultado"></div>
                
            </div>
        </form>

    </div>
    <script src="script.js"></script>
</body>
</html>
