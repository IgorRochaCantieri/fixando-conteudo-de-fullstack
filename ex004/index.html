<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Formularios</title>
</head>
<body>

    <div class="container">
        <div>
            <h1>Preencher endereço usando viaCep</h1>
        </div>

        <div class="container">
            <div>
                <h2 class="mb-3 text-success">Digite o CEP</h2>
            </div>

            <div>
                <p>Os dados do endereço serão preenchidos automaticamente</p>
            </div>

            <div>
                <form action="">
                    <div class="mb-3">
                        <div><label for="cep">CEP</label></div>
                        <div><input type="text" id="cep" class="form-control"></div>
                    </div>

                    <div class="mb-3">
                        <div><label for="rua">Rua</label></div>
                        <div><input type="text" id="rua" class="form-control"></div>
                    </div>

                    <div class="mb-3">
                        <div><label for="bairro">Bairro</label></div>
                        <div><input type="text" id="bairro" class="form-control"></div>
                    </div>

                    <div class="mb-3">
                        <div><label for="cidade">Cidade</label></div>
                        <div><input type="text" id="cidade" class="form-control"></div>
                    </div>

                    <div class="mb-3">
                        <div><label for="estado">Estado</label></div>
                        <div><input type="text" id="estado" class="form-control"></div>
                    </div>

                    <div class="mb-3">
                        <div><label for="ibge">IBGE</label></div>
                        <div><input type="text" id="ibge" class="form-control"></div>
                    </div>

                </form>
            </div>

            <!--
            <div class="mb-3">
                <div><label for="cep">Cep</label></div>
                <div><input type="text" id="cep" class="form-control"></div>
            </div>
            -->

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
