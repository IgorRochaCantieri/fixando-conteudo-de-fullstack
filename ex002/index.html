<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Segundo exercicio</title>
</head>
<body>
    <div class="container">
        <div class="mb-3 text-success"><h1>Select e JavaScript</h1></div>

        <div class="mb-3">
            <h2>Qual elemento da lista foi selecionado ?</h2>

            <div class="mb-3"><p>Selecione uma das opções:</p></div>
        </div>

        <form action="">
            <div class="mb-3">
                <select id="select1">
                    <option value="free">grátis</option>
                    <option value="basic">básico</option>
                    <option value="premium">líder</option>
                </select>
            </div>
        </form>

        <div>
            <p>O valor selecionado é: <span class="output"></span></p>
        </div>

        <div>
            <button onclick="getOption()">Veja a seleção</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
