<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Checkbox e javascript</title>
</head>
<body>

    <div class="container">
        <h1 class=" text-success mb-3">CheckBox e JavaScript</h1>

        <h2>Elementos Check</h2>

        <div>
            <p class="mb-3">Trabalho  <input type="checkbox" name="work" value="work"></p>
            <p class="mb-3">Estudos  <input type="checkbox" name="study" value="study"></p>
            <p class="mb-3">Saude  <input type="checkbox" name="healt" value="healt"></p>
        </div>

        <p>
            <button onclick="getChekedBox()">Enviar</button>
        </p>

        <p>Minhas prioridades são: <span id="prioridades"></span></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
